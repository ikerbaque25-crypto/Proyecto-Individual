
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión Profesional</title>

    <!-- CONEXIÓN CON CSS -->
    <link rel="stylesheet" href="../css/Proyecto%201.css">
</head>

<body>

    <main class="fondo">

        <!-- Luces decorativas -->
        <div class="luz luz1"></div>
        <div class="luz luz2"></div>
        <div class="luz luz3"></div>

        <!-- Formulario central -->
        <section class="login">

            <div class="logo">◆</div>

            <h1>BIENVENIDO</h1>

            <p class="descripcion">
                Inicia sesión para acceder a tu cuenta
            </p>

            <form id="formulario">

                <div class="campo">
                    <label>Nombre de usuario</label>
                    <input
                        type="text"
                        placeholder="Escribe tu usuario"
                        required>
                </div>

                <div class="campo">
                    <label>Contraseña</label>
                    <input
                        type="password"
                        placeholder="Escribe tu contraseña"
                        required>
                </div>

                <div class="opciones">

                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">¿Olvidaste tu contraseña?</a>

                </div>

                <button type="submit">
                    INICIAR SESIÓN
                </button>

            </form>

            <p id="mensaje"></p>

            <div class="linea">
                <span>PORTAL DIGITAL</span>
            </div>

            <p class="registro">
                ¿No tienes una cuenta?
                <a href="#">Crear cuenta</a>
            </p>

            <footer>
                © 2026 | Mi página web
            </footer>

        </section>

    </main>

    <!-- JavaScript -->
    <script>

        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            mensaje.textContent = "¡Inicio de sesión exitoso!";
            mensaje.style.color = "#55ffae";

            setTimeout(function() {
                alert("¡Bienvenido al sistema!");
            }, 300);

        });

    </script>

</body>
</html>
